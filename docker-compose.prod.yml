services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - eugene_database
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - daphne
      - -b
      - 0.0.0.0
      - -p
      - "8000"
      - config.asgi:application
    env_file:
      - .env.production
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    restart: unless-stopped
    networks:
      - eugene_database
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; req = urllib.request.Request('http://127.0.0.1:8000/health/', headers={'Host': 'collabspace.eugene-dev-hub.space', 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(req, timeout=3)"

      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - celery
      - -A
      - config
      - worker
      - --loglevel=info
      - --concurrency=1
    env_file:
      - .env.production
    restart: unless-stopped
    networks:
      - eugene_database
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 384m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - eugene_proxy
      - eugene_database
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  eugene_proxy:
    external: true
  eugene_database:
    external: true

volumes:
  static_data:
  media_data:
