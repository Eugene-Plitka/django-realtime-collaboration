server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    client_max_body_size 20M;

    resolver 127.0.0.11
        valid=10s
        ipv6=off;

    set $backend web:8000;


    location /static/ {
        alias /var/www/static/;

        expires 7d;

        add_header
            Cache-Control
            "public";
    }

    location /media/ {
        alias /var/www/media/;

        expires 7d;

        add_header
            Cache-Control
            "public";
    }

    location /assets/ {
        try_files
            $uri
            =404;

        expires 1y;

        add_header
            Cache-Control
            "public, immutable";
    }


    location /api/ {
        proxy_pass http://$backend;

        proxy_http_version 1.1;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header
            X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header
            X-Forwarded-Proto
            $scheme;

        proxy_set_header
            X-Forwarded-Host
            $http_host;
    }


    location /accounts/ {
        proxy_pass http://$backend;

        proxy_http_version 1.1;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header
            X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header
            X-Forwarded-Proto
            $scheme;

        proxy_set_header
            X-Forwarded-Host
            $http_host;
    }


    location /admin/ {
        proxy_pass http://$backend;

        proxy_http_version 1.1;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header
            X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header
            X-Forwarded-Proto
            $scheme;

        proxy_set_header
            X-Forwarded-Host
            $http_host;
    }


    location /health/ {
        proxy_pass http://$backend;

        proxy_http_version 1.1;

        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header
            X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header
            X-Forwarded-Proto
            $scheme;

        proxy_set_header
            X-Forwarded-Host
            $http_host;
    }


    location /ws/ {
        proxy_pass http://$backend;

        proxy_http_version 1.1;

        proxy_set_header
            Upgrade
            $http_upgrade;

        proxy_set_header
            Connection
            "upgrade";

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header
            X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header
            X-Forwarded-Proto
            $scheme;

        proxy_set_header
            X-Forwarded-Host
            $http_host;

        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }


    location / {
        try_files
            $uri
            $uri/
            /index.html;
    }
}